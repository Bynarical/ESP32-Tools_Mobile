# Publish web/ to GitHub Pages.
#
# Manual only, on purpose. Pages is not enabled on this repository yet, and a
# push-triggered job would fail on every commit until it is. Once Pages is on
# (Settings -> Pages -> Source: GitHub Actions), uncomment the `push` trigger
# below and every change to the web app deploys itself.
#
# Read web/README.md before enabling this. Pages is HTTPS-only - *.github.io is
# in the browsers' HSTS preload list, so the scheme cannot be downgraded - which
# means a Pages deployment can do Bluetooth and can never reach the board over
# Wi-Fi. That makes it an Android tool, and of no use on an iPhone, which has no
# Web Bluetooth in any browser.
name: Deploy web app to Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['web/**', 'src/lib/**', 'src/ota/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a running one, since it is what is live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The bundle is built from the same modules the mobile app ships, so a
      # broken shared module must stop the deploy rather than reach the page.
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:web

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
